apiVersion: batch/v1
kind: CronJob
metadata: { name: postgres-backup }
spec:
  schedule: "30 3 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      template:
        spec:
          restartPolicy: Never
          containers:
            - name: backup
              image: postgres:16
              command: ["/bin/sh", "-c"]
              args:
                - >-
                  pg_dump -h postgres.tcgtracker.svc.cluster.local -U pokeidle pokeidle > /backup/pokeidle-$(date +%F).sql
                  && find /backup -maxdepth 1 -name 'pokeidle-*.sql' -mtime +14 -delete
              env: [{ name: PGPASSWORD, valueFrom: { secretKeyRef: { name: pokeidle-secrets, key: POSTGRES_PASSWORD } } }]
              resources:
                requests: { cpu: 10m, memory: 32Mi }
                limits: { memory: 128Mi }
              volumeMounts: [{ name: backup, mountPath: /backup }]
          volumes: [{ name: backup, persistentVolumeClaim: { claimName: pokeidle-backup-pvc } }]
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: { name: pokeidle-backup-pvc }
spec: { accessModes: ["ReadWriteOnce"], resources: { requests: { storage: 2Gi } } }
