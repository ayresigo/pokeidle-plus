apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: central-api
  annotations:
    cert-manager.io/cluster-issuer: letsencrypt-prod
spec:
  ingressClassName: traefik
  rules:
    - host: pokeidle.ayresigo.dev
      http:
        paths:
          - path: /
            pathType: Prefix
            backend: { service: { name: central-api, port: { number: 80 } } }
  tls:
    - hosts: [pokeidle.ayresigo.dev]
      secretName: pokeidle-tls
