apiVersion: apps/v1
kind: Deployment
metadata: { name: central-api }
spec:
  replicas: 1
  strategy: { type: Recreate }
  selector: { matchLabels: { app: central-api } }
  template:
    metadata: { labels: { app: central-api } }
    spec:
      containers:
        - name: central-api
          image: ghcr.io/ayresigo/mpw-central-api
          envFrom: [{ secretRef: { name: pokeidle-secrets } }]
          env:
            - { name: PORT, value: "8080" }
          ports: [{ containerPort: 8080 }]
          resources:
            requests: { cpu: 50m, memory: 96Mi }
            limits: { memory: 256Mi }
          readinessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 5, periodSeconds: 10 }
          livenessProbe: { httpGet: { path: /health, port: 8080 }, initialDelaySeconds: 30, periodSeconds: 15 }
---
apiVersion: v1
kind: Service
metadata: { name: central-api }
spec: { selector: { app: central-api }, ports: [{ port: 80, targetPort: 8080 }] }
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata: { name: central-api-allow-traefik }
spec:
  podSelector: { matchLabels: { app: central-api } }
  policyTypes: [Ingress]
  ingress:
    - from:
        - namespaceSelector: { matchLabels: { kubernetes.io/metadata.name: kube-system } }
          podSelector: { matchLabels: { app.kubernetes.io/name: traefik } }
      ports:
        - { protocol: TCP, port: 8080 }
