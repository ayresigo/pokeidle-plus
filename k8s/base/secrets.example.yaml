apiVersion: v1
kind: Secret
metadata:
  name: pokeidle-secrets
  namespace: pokeidle
type: Opaque
stringData:
  DATABASE_URL: postgresql://pokeidle:<POSTGRES_PASSWORD>@postgres.tcgtracker.svc.cluster.local:5432/pokeidle
  POSTGRES_PASSWORD: <senha da role pokeidle no Postgres>
  JWT_SECRET: <openssl rand -hex 32>
  SECRETS_KEY: <openssl rand -hex 32>
  ADMIN_USERNAME: <admin inicial>
  ADMIN_PASSWORD: <senha do admin inicial>
