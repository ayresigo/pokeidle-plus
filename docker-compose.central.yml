name: mpw-central

services:
  central-api:
    image: ${IMAGE_REGISTRY:-ghcr.io/ayresigo}/mpw-central-api:${MPW_TAG:-stable}
    ports:
      - "127.0.0.1:${CENTRAL_PORT:-8080}:8080"
    environment:
      DATABASE_URL: postgresql://mpw:${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}@db:5432/mpw
      JWT_SECRET: ${JWT_SECRET:?defina JWT_SECRET (mínimo 32 caracteres)}
      SECRETS_KEY: ${SECRETS_KEY:?defina SECRETS_KEY (64 caracteres hex)}
      ADMIN_USERNAME: ${ADMIN_USERNAME:?defina ADMIN_USERNAME}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?defina ADMIN_PASSWORD}
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mpw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD}
      POSTGRES_DB: mpw
    volumes:
      - mpw-central-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mpw -d mpw"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

volumes:
  mpw-central-db: {}
