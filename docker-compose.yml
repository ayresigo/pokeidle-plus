name: mpw

services:
  web:
    image: ${IMAGE_REGISTRY:-ghcr.io/ayresigo}/mpw-web:${MPW_TAG:-stable}
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      CONTROL_PLANE_URL: http://control-plane:4000
    depends_on:
      control-plane:
        condition: service_healthy
    restart: unless-stopped
    labels:
      mpw.role: web

  control-plane:
    image: ${IMAGE_REGISTRY:-ghcr.io/ayresigo}/mpw-control-plane:${MPW_TAG:-stable}
    environment:
      CENTRAL_API_URL: ${CENTRAL_API_URL:?defina CENTRAL_API_URL no .env}
      IMAGE_REGISTRY: ${IMAGE_REGISTRY:-ghcr.io/ayresigo}
      AUTO_UPDATE: ${AUTO_UPDATE:-true}
      WORKER_NETWORK: mpw
      CONTROL_PLANE_URL: http://control-plane:4000
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - mpw-data:/data
    restart: unless-stopped
    labels:
      mpw.role: control-plane
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:4000/health').then((r) => process.exit(r.ok ? 0 : 1), () => process.exit(1))"
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 20s

networks:
  default:
    name: mpw

volumes:
  mpw-data: {}
